name: build

# Builds a glenley release from the private source repository and publishes it here, where the
# website's download links and the app's Update button look. It runs in this public repository
# because Actions minutes are free here; the source stays private: it is fetched with a
# read-only deploy key (secret SOURCE_DEPLOY_KEY) and only the built files are published.
#
# Run it from the Actions tab (or `gh workflow run build -f tag=v0.1.26`) after pushing the tag
# to the source repository. Only people with write access here can run it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Source tag to build, like v0.1.26"
        required: true

permissions:
  contents: write # publish the release in this repository

env:
  TAG: ${{ inputs.tag }}
  CARSON_DEFAULT_SERVER: https://app.glenley.in

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Tag looks like a release
        run: echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::tag must look like v1.2.3"; exit 1; }

  agent-macos:
    needs: check
    strategy:
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with: { repository: shivambisen/carson-remote, ref: "${{ inputs.tag }}", ssh-key: "${{ secrets.SOURCE_DEPLOY_KEY }}", persist-credentials: false }
      # screencapturekit's Swift bridge (apple-metal) uses macOS 26 SDK APIs (MTLTensor).
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: packaging/macos/build.sh ${{ matrix.target }}
        env:
          MACOS_SIGN_P12_BASE64: "${{ secrets.MACOS_SIGN_P12_BASE64 }}"
          MACOS_SIGN_P12_PASSWORD: "${{ secrets.MACOS_SIGN_P12_PASSWORD }}"
      - uses: actions/upload-artifact@v4
        with: { name: "agent-${{ matrix.target }}", path: dist/* }

  agent-windows:
    needs: check
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v5
        with: { repository: shivambisen/carson-remote, ref: "${{ inputs.tag }}", ssh-key: "${{ secrets.SOURCE_DEPLOY_KEY }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (no source-compiled OpenH264)
        working-directory: agent
        run: cargo build --release -p carson-agent --bins --no-default-features
      - name: Installer (Inno Setup)
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' agent/Cargo.toml | head -1)
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -x "$ISCC" ] || { choco install innosetup -y --no-progress >/dev/null; }
          "$ISCC" //Qp //DVersion=$VERSION packaging/windows/glenley.iss
          (cd dist && sha256sum glenley-setup-*.exe > "glenley-setup-$VERSION-windows-x86_64.exe.sha256")
      - name: Package CLI zip
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' agent/Cargo.toml | head -1)
          NAME=glenley-agent-$VERSION-windows-x86_64
          mkdir -p "dist/$NAME"
          cp agent/target/release/glenley-agent.exe agent/target/release/glenley.exe packaging/windows/install.ps1 "dist/$NAME/"
          cp packaging/README-agent.txt "dist/$NAME/README.txt"
          cp LICENSE "dist/$NAME/"
          (cd dist && 7z a "$NAME.zip" "$NAME" >/dev/null && sha256sum "$NAME.zip" > "$NAME.zip.sha256" && rm -rf "$NAME")
      - uses: actions/upload-artifact@v4
        with: { name: agent-windows, path: dist/* }

  server:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { repository: shivambisen/carson-remote, ref: "${{ inputs.tag }}", ssh-key: "${{ secrets.SOURCE_DEPLOY_KEY }}", persist-credentials: false }
      - uses: actions/setup-go@v6
        with: { go-version-file: server/go.mod }
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - name: Build server tarballs (viewer bundled)
        env: { VERSION: "${{ inputs.tag }}" }
        run: |
          for t in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            packaging/server/build.sh "${t%/*}" "${t#*/}"
          done
          (cd dist && sha256sum *.tar.gz > server-SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with: { name: server, path: dist/* }

  publish:
    needs: [agent-macos, agent-windows, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true, pattern: "agent-*" }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true, name: server }
      - name: Version-free copies for direct download links
        # The website links to …/releases/latest/download/<name>, which always serves the
        # newest release, so these names never change between versions.
        run: |
          cd dist
          cp glenley-setup-*-windows-x86_64.exe glenley-setup-windows-x86_64.exe
          cp glenley-agent-*-windows-x86_64.zip glenley-windows-x86_64.zip
          for a in arm64 x86_64; do cp glenley-*-macos-$a.zip glenley-macos-$a.zip; done
          ls -la
      - name: Checksums
        run: cd dist && sha256sum glenley-setup-windows-x86_64.exe glenley-windows-x86_64.zip glenley-macos-*.zip > direct-SHA256SUMS && cat *.sha256 server-SHA256SUMS direct-SHA256SUMS | tee SHA256SUMS
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # Re-running replaces the files of a release that's already there.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target main --title "$TAG" --latest \
              --notes "glenley $TAG. Download from https://glenley.in; the glenley app updates itself."
          fi
